<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>展会嘉宾挖掘机 · 飞书直写</title>
<style>
  :root{
    --bg:#0e1318; --surface:#161d25; --surface-2:#1d2630; --border:#2a343f;
    --text:#e8eef4; --muted:#8c9aa8; --accent:#5ee6c4; --accent-dim:#2a6d5f;
    --warn:#ffb454; --danger:#ff6b6b; --radius:12px;
    --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Inter,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.55;
    background-image:radial-gradient(900px 500px at 80% -10%, rgba(94,230,196,.07), transparent 60%);}
  .wrap{max-width:980px;margin:0 auto;padding:40px 20px 80px}
  header{margin-bottom:28px}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
  h1{font-size:30px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0;font-size:15px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-top:20px}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 7px;font-family:var(--mono);letter-spacing:.03em}
  input[type=url]{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    border-radius:9px;padding:13px 14px;font-size:15px;font-family:var(--mono);outline:none;transition:border-color .15s,box-shadow .15s}
  input[type=url]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,230,196,.15)}
  .opts{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px;align-items:center}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);cursor:pointer;user-select:none}
  .chk input{accent-color:var(--accent);width:16px;height:16px}
  .hint{font-size:12px;color:var(--muted)}
  .actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
  button{font-family:var(--sans);font-size:15px;font-weight:600;border-radius:9px;padding:12px 22px;
    border:1px solid transparent;cursor:pointer;transition:transform .08s,background .15s,opacity .15s}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn-go{background:var(--accent);color:#04130f}
  .btn-go:hover:not(:disabled){background:#74f0d3}
  .btn-ghost{background:transparent;color:var(--text);border-color:var(--border)}
  .btn-ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  #status{margin-top:18px;font-family:var(--mono);font-size:13.5px;min-height:20px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .spin{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.25}}
  .stat-row{display:flex;gap:24px;margin:18px 0 6px;flex-wrap:wrap}
  .stat{font-family:var(--mono)}
  .stat b{font-size:26px;color:var(--accent);font-weight:700}
  .stat span{display:block;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  .warns{margin-top:14px}
  .warn-item{background:rgba(255,180,84,.08);border:1px solid rgba(255,180,84,.25);color:#ffd79b;
    border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:8px}
  table{width:100%;border-collapse:collapse;margin-top:18px;font-size:13.5px}
  th{text-align:left;color:var(--muted);font-family:var(--mono);font-weight:500;font-size:11px;
    letter-spacing:.08em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--border)}
  td{padding:10px;border-bottom:1px solid var(--surface-2);vertical-align:top}
  tr:hover td{background:var(--surface-2)}
  td a{color:var(--accent);text-decoration:none}
  td a:hover{text-decoration:underline}
  .empty{color:var(--muted);font-size:13px;padding:14px 0}
  .tablewrap{overflow-x:auto}
  footer{margin-top:34px;color:var(--muted);font-size:12px;line-height:1.7}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Speaker Intel</p>
    <h1>展会嘉宾挖掘机</h1>
    <p class="sub">粘贴展会/会议网址，自动提取嘉宾的姓名、职位、公司、领英、邮箱，一键写入你的飞书表格。</p>
  </header>

  <div class="panel">
    <label for="urlInput">展会网址</label>
    <input id="urlInput" type="url" placeholder="https://example.com/speakers" autocomplete="off" spellcheck="false" />

    <div class="opts">
      <label class="chk"><input type="checkbox" id="optJina" /> JS 渲染<span class="hint">（动态网站抓不到内容时打开，用 Jina 免费渲染）</span></label>
      <label class="chk"><input type="checkbox" id="optDeep" /> 深度扫描<span class="hint">（进入每位嘉宾详情页找邮箱/领英，更准但更慢）</span></label>
      <label class="chk"><input type="checkbox" id="optPreview" /> 仅预览<span class="hint">（先看结果，不写入飞书）</span></label>
    </div>

    <div class="actions">
      <button class="btn-go" id="btnGo">开始挖取</button>
      <button class="btn-ghost" id="btnCopy" disabled>复制为表格</button>
    </div>

    <div id="status"></div>
  </div>

  <div class="panel" id="results" style="display:none">
    <div class="stat-row">
      <div class="stat"><b id="cFound">0</b><span>提取到</span></div>
      <div class="stat"><b id="cWritten">0</b><span>已写入飞书</span></div>
    </div>
    <div class="warns" id="warns"></div>
    <div class="tablewrap">
      <table id="tbl">
        <thead><tr><th>姓名</th><th>职位</th><th>公司</th><th>领英</th><th>邮箱</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <footer>
    数据来源于目标网站公开页面。请遵守目标网站的服务条款与当地隐私/反垃圾邮件法规（如 GDPR、CAN-SPAM），仅将抓取信息用于合规用途。<br>
    部分网站靠 JavaScript 动态加载，简单抓取可能拿不到内容——此时换用嘉宾列表页直链，或开启「JS 渲染」/「深度扫描」。
  </footer>
</div>

<script>
// 包进 IIFE，避免脚本里的函数名与页面元素 id 在 window 上互相覆盖（上一版报错 "render is not a function" 就是这个原因）
(function () {
  'use strict';
  var ENDPOINT = '/.netlify/functions/scrape';
  var lastSpeakers = [];

  function $(id) { return document.getElementById(id); }

  function setStatus(html, kind) {
    var colors = { run: 'var(--accent)', ok: 'var(--accent)', warn: 'var(--warn)', err: 'var(--danger)' };
    var c = colors[kind] || 'var(--muted)';
    var spin = kind === 'run' ? ' spin' : '';
    $('status').innerHTML = '<span class="dot' + spin + '" style="background:' + c + '"></span><span style="color:' + c + '">' + html + '</span>';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function showResults(data) {
    $('results').style.display = 'block';
    $('cFound').textContent = data.found || 0;
    $('cWritten').textContent = data.written || 0;

    var warns = $('warns');
    warns.innerHTML = '';
    (data.warnings || []).forEach(function (w) {
      var d = document.createElement('div');
      d.className = 'warn-item';
      d.textContent = w;
      warns.appendChild(d);
    });

    var tb = $('tbl').querySelector('tbody');
    tb.innerHTML = '';
    if (!lastSpeakers.length) {
      tb.innerHTML = '<tr><td colspan="5" class="empty">无数据</td></tr>';
      $('btnCopy').disabled = true;
      return;
    }
    lastSpeakers.forEach(function (s) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + esc(s.name) + '</td>' +
        '<td>' + esc(s.title) + '</td>' +
        '<td>' + esc(s.company) + '</td>' +
        '<td>' + (s.linkedin ? '<a href="' + esc(s.linkedin) + '" target="_blank" rel="noopener">领英 ↗</a>' : '—') + '</td>' +
        '<td>' + (s.email ? '<a href="mailto:' + esc(s.email) + '">' + esc(s.email) + '</a>' : '—') + '</td>';
      tb.appendChild(tr);
    });
    $('btnCopy').disabled = false;
  }

  function run() {
    var url = $('urlInput').value.trim();
    if (!/^https?:\/\//i.test(url)) { setStatus('请输入有效网址（要带 http:// 或 https://）', 'err'); return; }

    var deep = $('optDeep').checked;
    var preview = $('optPreview').checked;
    var forceJina = $('optJina').checked;

    $('btnGo').disabled = true;
    $('btnCopy').disabled = true;
    setStatus(deep ? '抓取中…（深度扫描会逐页访问，请稍候）' : '抓取并解析中…', 'run');

    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ url: url, deepScan: deep, preview: preview, forceJina: forceJina, maxDetailPages: 8 })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data.ok) { setStatus('失败：' + (data.error || '未知错误'), 'err'); return; }
        lastSpeakers = data.speakers || [];
        showResults(data);
        if (data.found === 0) setStatus('没提取到嘉宾。看下方提示。', 'warn');
        else if (preview) setStatus('预览完成：提取到 ' + data.found + ' 位（未写入飞书）', 'ok');
        else if (data.written === data.found) setStatus('完成：' + data.written + ' 位已写入飞书 ✓', 'ok');
        else setStatus('提取到 ' + data.found + ' 位，写入 ' + data.written + ' 位（部分未写入，见提示）', 'warn');
      })
      .catch(function (e) { setStatus('请求出错：' + e.message, 'err'); })
      .then(function () { $('btnGo').disabled = false; });
  }

  function copyTable() {
    var header = ['姓名', '职位', '公司', '领英', '邮箱'].join('\t');
    var rows = lastSpeakers.map(function (s) { return [s.name, s.title, s.company, s.linkedin, s.email].join('\t'); });
    navigator.clipboard.writeText([header].concat(rows).join('\n')).then(function () {
      var b = $('btnCopy'); var t = b.textContent; b.textContent = '已复制 ✓';
      setTimeout(function () { b.textContent = t; }, 1500);
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    $('btnGo').addEventListener('click', run);
    $('btnCopy').addEventListener('click', copyTable);
    $('urlInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
  });
})();
</script>
</body>
</html>
